[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foamplot"
version = "1.0.2"
description = "Unix terminal plotter for foamLog-generated numeric files"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
authors = [
  { name = "Songrui Li", email = "lsongrui2024@gmail.com" }
]
keywords = [
  "terminal",
  "plot",
  "plotille",
  "openfoam",
  "foamlog",
  "cli"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Terminals"
]
dependencies = [
  "plotille>=4"
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/foamplot"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/foamplot"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/foamplot/issues"

[project.scripts]
foamplot = "foamplot.cli:main"
